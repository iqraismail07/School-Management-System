<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMS — School Management System</title>
<style>
  /* ============ SMS · "Emerald" design language ============
     Deep teal/emerald primary · warm amber accents · slate neutrals.
     Everything themeable via CSS variables; --primary is user-settable. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #0d9488; --primary-dark: #0f766e; --primary-deep: #115e59; --primary-ink: #ffffff;
    --accent: #f59e0b; --accent-dark: #d97706;
    --bg: #edf3f1; --surface: #ffffff; --surface2: #f5f9f8;
    --text: #1e293b; --muted: #64748b;
    --border: #e2e8f0; --input-border: #cbd5e1; --row-hover: #f0fdfa;
    --shadow: 0 1px 2px rgba(13, 60, 55, .06), 0 10px 28px -14px rgba(13, 60, 55, .18);
    --shadow-lg: 0 2px 4px rgba(13, 60, 55, .07), 0 18px 42px -16px rgba(13, 60, 55, .28);
    --radius: 16px;
    --sticky-top: 60px;
  }
  body.dark {
    --bg: #081210; --surface: #0f1d1b; --surface2: #0b1715;
    --text: #e7f0ed; --muted: #8fa9a3;
    --border: #1e3330; --input-border: #2b4541; --row-hover: #132624;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 34px -14px rgba(0, 0, 0, .65);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, .45), 0 24px 50px -16px rgba(0, 0, 0, .7);
  }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.45;
  }
  ::selection { background: rgba(13, 148, 136, .28); }

  /* ---------- app shell: sidebar + content ---------- */
  #app { display: flex; min-height: 100vh; }
  .hidden { display: none !important; }
  #sidebar {
    width: 250px; flex: 0 0 250px; height: 100vh; position: sticky; top: 0; z-index: 120;
    display: flex; flex-direction: column; color: #d7e9e4;
    background: linear-gradient(172deg, #0e2f2b 0%, #0a2320 55%, #081b19 100%);
    border-right: 1px solid rgba(255, 255, 255, .06);
    box-shadow: 8px 0 28px -18px rgba(0, 0, 0, .5);
  }
  body.dark #sidebar { background: linear-gradient(172deg, #0a1f1d 0%, #071413 60%, #060f0e 100%); }
  .side-brand { display: flex; align-items: center; gap: 11px; padding: 18px 14px 14px 18px; }
  .side-brand img { height: 42px; width: 42px; object-fit: contain; border-radius: 13px; background: #fff; padding: 4px; flex: 0 0 42px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35); }
  .side-brand #schoolTitle { font-size: 16.5px; font-weight: 800; letter-spacing: .2px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #railBtn {
    margin-left: auto; flex: 0 0 30px; width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .1); color: #cfe7e1; font-size: 15px; line-height: 1;
    transition: background .15s;
  }
  #railBtn:hover { background: rgba(255, 255, 255, .18); }
  body.nav-mini #railBtn { transform: scaleX(-1); }
  nav#tabs { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 12px 14px; display: flex; flex-direction: column; gap: 3px; }
  nav#tabs::-webkit-scrollbar { width: 6px; }
  nav#tabs::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 3px; }
  nav#tabs button {
    display: flex; align-items: center; gap: 11px; width: 100%;
    background: none; border: 0; color: #b9d4cd; padding: 8px 10px; border-radius: 12px;
    font-size: 13.8px; font-weight: 600; cursor: pointer; text-align: left; white-space: nowrap;
    transition: background .14s, color .14s, transform .14s;
  }
  nav#tabs button .ti {
    width: 32px; height: 32px; flex: 0 0 32px; display: flex; align-items: center; justify-content: center;
    font-size: 16px; border-radius: 10px; background: rgba(255, 255, 255, .07);
  }
  nav#tabs button .tl { overflow: hidden; text-overflow: ellipsis; }
  nav#tabs button:hover { background: rgba(255, 255, 255, .07); color: #fff; }
  nav#tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  nav#tabs button.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .18);
  }
  nav#tabs button.active .ti { background: rgba(255, 255, 255, .2); }
  .side-foot { padding: 14px; border-top: 1px solid rgba(255, 255, 255, .09); }
  .side-user { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; padding: 0 2px; }
  .side-user .who { font-size: 13px; font-weight: 700; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-user .who::before { content: '●'; color: #34d399; font-size: 9px; margin-right: 7px; vertical-align: 2px; }
  .side-actions { display: flex; gap: 7px; }
  .side-actions button {
    flex: 1; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .1);
    color: #e9f5f2; border-radius: 11px; padding: 9px 0; cursor: pointer; font-size: 15px;
    transition: background .14s, transform .14s;
  }
  .side-actions button:hover { background: rgba(255, 255, 255, .17); transform: translateY(-1px); }
  .side-actions button.danger { background: rgba(239, 68, 68, .14); border-color: rgba(239, 68, 68, .4); }
  .side-actions button.danger:hover { background: #dc2626; border-color: #dc2626; color: #fff; }
  .side-scrim { display: none; }

  .app-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header.topbar {
    position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: 13px;
    min-height: var(--sticky-top); padding: 10px 24px;
    background: rgba(255, 255, 255, .82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  body.dark header.topbar { background: rgba(15, 29, 27, .82); }
  #pageTitle { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }
  #menuBtn {
    display: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 18px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  }
  #menuBtn:hover { border-color: var(--primary); color: var(--primary); }

  main { padding: 26px 28px 40px; max-width: 1300px; width: 100%; margin: 0 auto; flex: 1; }
  h2.sec { margin: 2px 0 18px; font-size: 24px; font-weight: 800; letter-spacing: -.015em; position: relative; padding-bottom: 11px; }
  h2.sec::after { content: ''; position: absolute; left: 0; bottom: 0; width: 48px; height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, var(--primary), var(--accent)); }
  h3.sub { margin: 24px 0 10px; font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .13em; color: var(--muted); }

  /* ---------- stat cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .card {
    position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 19px 19px 17px; box-shadow: var(--shadow); overflow: hidden;
    transition: transform .16s ease, box-shadow .16s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: var(--card-accent, linear-gradient(90deg, var(--primary), var(--primary-dark))); }
  .card .ic { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    font-size: 21px; background: var(--card-tint, rgba(13, 148, 136, .12)); margin-bottom: 13px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35); }
  .card .n { font-size: 27px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .card .l { font-size: 12.8px; color: var(--muted); margin-top: 3px; font-weight: 600; }
  .card .t { font-size: 11.6px; color: var(--muted); margin-top: 9px; display: flex; align-items: center; gap: 7px; }
  .card .t::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--card-dot, var(--primary)); flex: 0 0 6px; }
  .card.c-blue  { --card-accent: linear-gradient(90deg, #38bdf8, #2563eb); --card-tint: rgba(37, 99, 235, .13);  --card-dot: #2563eb; }
  .card.c-green { --card-accent: linear-gradient(90deg, #34d399, #059669); --card-tint: rgba(5, 150, 105, .13);  --card-dot: #059669; }
  .card.c-red   { --card-accent: linear-gradient(90deg, #fb7185, #dc2626); --card-tint: rgba(220, 38, 38, .11);  --card-dot: #dc2626; }
  .card.c-amber { --card-accent: linear-gradient(90deg, #fbbf24, #d97706); --card-tint: rgba(217, 119, 6, .15);  --card-dot: #d97706; }
  .card.c-purple{ --card-accent: linear-gradient(90deg, #a78bfa, #7c3aed); --card-tint: rgba(124, 58, 237, .13); --card-dot: #7c3aed; }
  .card.c-teal  { --card-accent: linear-gradient(90deg, #2dd4bf, #0d9488); --card-tint: rgba(13, 148, 136, .13); --card-dot: #0d9488; }

  /* ---------- tables ---------- */
  table.grid {
    width: 100%; background: var(--surface); border-collapse: separate; border-spacing: 0;
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow); margin-top: 12px; font-size: 14px;
  }
  table.grid th, table.grid td { padding: 11px 13px; text-align: left; }
  table.grid th {
    background: var(--surface2); color: var(--muted); font-size: 11.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .07em; white-space: nowrap;
    border-bottom: 2px solid var(--border); position: static;
  }
  /* Header kept static on purpose: position:sticky on th inside a table with
     overflow:hidden + border-radius makes Chrome paint the header overlapping /
     ghosting over the first data row (seen on Students, invoices, timetable).
     Tables here are paginated, so sticky buys nothing — clean static wins. */
  table.grid td { border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  table.grid tr:last-child td { border-bottom: 0; }
  table.grid tbody tr { transition: background .12s; }
  table.grid tbody tr:hover td { background: var(--row-hover); }
  /* nowrap helper: IDs, months, amounts, receipt/cert numbers must never wrap mid-value */
  table.grid td.nw, table.grid th.nw { white-space: nowrap; }
  table.grid td.idcol { white-space: nowrap; min-width: 54px; }
  /* ---------- timetable ---------- */
  .ttwrap { overflow-x: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
  .ttwrap table.grid { margin-top: 0; border: 0; box-shadow: none; border-radius: 0; }
  .tt-cell { font-size: 13px; line-height: 1.5; min-width: 120px; }
  .tt-cell .tt-sub { font-weight: 700; }
  .tt-cell .tt-t, .tt-cell .tt-r { font-size: 12px; color: var(--muted); }
  .tt-cell .tt-a { margin-top: 5px; }

  /* ---------- buttons / forms ---------- */
  .btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: 0;
    padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 700;
    box-shadow: 0 5px 14px -6px rgba(13, 148, 136, .55), inset 0 1px 0 rgba(255, 255, 255, .2);
    transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.07); box-shadow: 0 9px 20px -7px rgba(13, 148, 136, .6); }
  .btn:active { transform: translateY(0); }
  .btn.small { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }
  .btn.danger { background: linear-gradient(135deg, #f87171, #dc2626); box-shadow: 0 5px 14px -6px rgba(220, 38, 38, .5), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.green { background: linear-gradient(135deg, #34d399, #059669); box-shadow: 0 5px 14px -6px rgba(5, 150, 105, .5), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.warn { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 5px 14px -6px rgba(217, 119, 6, .5), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn.grey { background: linear-gradient(135deg, #94a3b8, #64748b); box-shadow: 0 5px 14px -6px rgba(100, 116, 139, .5), inset 0 1px 0 rgba(255,255,255,.2); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  body.dark .btn { box-shadow: 0 5px 16px -6px rgba(45, 212, 191, .35), inset 0 1px 0 rgba(255, 255, 255, .15); }
  .toolbar { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; align-items: center; }
  input, select, textarea {
    padding: 10px 13px; border: 1.5px solid var(--input-border); border-radius: 11px;
    font-size: 14px; background: var(--surface); color: var(--text); font-family: inherit;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, .18);
  }
  textarea { min-height: 70px; width: 100%; }
  .formbox {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .formbox h3 { margin-bottom: 13px; font-size: 15.5px; font-weight: 800; letter-spacing: -.01em; }
  .formbox .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .formbox .row > * { margin-bottom: 6px; }
  .formbox.gazette-panel { position: relative; overflow: hidden; }
  .formbox.gazette-panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--primary-dark), var(--accent)); }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

  /* ---------- badges ---------- */
  .badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; border: 1px solid transparent; white-space: nowrap; }
  .b-paid, .b-present, .b-active, .b-approved { background: #d1fae5; color: #065f46; border-color: #a7f3d0; }
  .b-partial, .b-leave, .b-pending { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .b-unpaid, .b-absent, .b-overdue, .b-inactive, .b-rejected { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
  body.dark .b-paid, body.dark .b-present, body.dark .b-active, body.dark .b-approved { background: rgba(6, 78, 59, .55); color: #a7f3d0; border-color: #065f46; }
  body.dark .b-partial, body.dark .b-leave, body.dark .b-pending { background: rgba(120, 53, 15, .5); color: #fde68a; border-color: #92400e; }
  body.dark .b-unpaid, body.dark .b-absent, body.dark .b-overdue, body.dark .b-inactive, body.dark .b-rejected { background: rgba(127, 29, 29, .5); color: #fecaca; border-color: #991b1b; }

  /* ---------- login (emerald edition of the split-card design) ---------- */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background:
      radial-gradient(1000px 520px at 12% 8%, rgba(45, 212, 191, .22), transparent 60%),
      radial-gradient(820px 520px at 92% 92%, rgba(245, 158, 11, .15), transparent 60%),
      linear-gradient(135deg, #0b3b36 0%, #082a27 55%, #061d1b 100%); }
  body.dark #login { background:
      radial-gradient(1000px 520px at 12% 8%, rgba(45, 212, 191, .12), transparent 60%),
      linear-gradient(135deg, #061210 0%, #050d0c 60%, #030807 100%); }
  .login-card { display: flex; width: 880px; max-width: 100%; border-radius: 24px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .45); background: var(--surface); border: 1px solid rgba(255,255,255,.08); }
  .login-brand { flex: 1.1; padding: 48px 40px; color: #fff; display: flex; flex-direction: column;
    align-items: center; text-align: center; justify-content: center;
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 55%, #0a2a26 130%); position: relative; }
  .login-brand::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 85% 12%, rgba(255,255,255,.22), transparent 42%); }
  .login-brand::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 8% 92%, rgba(245, 158, 11, .28), transparent 40%); }
  .login-brand img.clogo { height: 84px; width: 84px; object-fit: contain; border-radius: 20px; background: #fff; padding: 8px; margin-bottom: 16px; box-shadow: 0 8px 22px rgba(0,0,0,.3); position: relative; z-index: 1; }
  .login-brand .brand-mark { font-size: 58px; margin-bottom: 12px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); position: relative; z-index: 1; }
  .login-brand h2 { font-size: 30px; font-weight: 800; letter-spacing: .3px; position: relative; z-index: 1; }
  .login-brand .sub { font-size: 14px; opacity: .92; margin: 6px 0 26px; position: relative; z-index: 1; }
  .login-brand ul { list-style: none; text-align: left; font-size: 14px; line-height: 2.1; opacity: .95; position: relative; z-index: 1; }
  .login-form { flex: 1; padding: 48px 44px; display: flex; flex-direction: column; justify-content: center; }
  .login-form h3 { font-size: 24px; margin-bottom: 4px; font-weight: 800; letter-spacing: -.01em; }
  .login-form .fsub { color: var(--muted); font-size: 13.5px; margin-bottom: 22px; }
  .login-form label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 10px 0 5px; text-transform: uppercase; letter-spacing: .06em; }
  .login-form input { width: 100%; padding: 13px 15px; border-radius: 12px; }
  .login-form .btn { width: 100%; padding: 14px; font-size: 15.5px; margin-top: 22px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; font-weight: 800; }
  #login .err { color: #f87171; font-size: 13px; margin-bottom: 6px; min-height: 18px; font-weight: 600; }
  body:not(.dark) #login .err { color: #dc2626; }
  .demo-logins { font-size: 11.5px; color: var(--muted); margin-top: 18px; line-height: 1.7; text-align: center; }
  @media (max-width: 720px) {
    .login-card { flex-direction: column; }
    .login-brand { padding: 30px 24px; }
    .login-brand ul { display: none; }
    .login-form { padding: 30px 24px; }
  }

  /* ---------- modal ---------- */
  #modalWrap { position: fixed; inset: 0; background: rgba(5, 15, 14, .55);
    -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  #modalBox { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 26px;
    max-width: 460px; width: 100%; box-shadow: 0 26px 64px -12px rgba(0, 0, 0, .45);
    animation: modal-pop .22s ease; }
  @keyframes modal-pop { from { transform: translateY(14px) scale(.98); opacity: 0; } }
  #modalBox h3 { margin-bottom: 14px; font-size: 18px; font-weight: 800; }
  #modalBox input { width: 100%; margin-bottom: 10px; }
  #modalBox .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

  /* ---------- Student cards ---------- */
  .idgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; margin-top: 14px; }
  .idcard { position: relative; border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px 16px;
    background: var(--surface); display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); overflow: hidden; }
  .idcard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, var(--primary), var(--primary-dark), var(--accent)); }
  .idcard img { width: 84px; height: 100px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
  .idcard .noimg { width: 84px; height: 100px; border-radius: 10px; border: 1.5px dashed var(--input-border);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; text-align: center; }
  .idcard .dt { font-size: 13px; line-height: 1.65; }
  .idcard .dt .nm { font-weight: 800; font-size: 15px; }
  .idcard .dt .sch { font-size: 12px; color: var(--muted); font-weight: 700; }

  /* ---------- announcements ---------- */
  .ann { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 14px; padding: 15px 18px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .ann .t { font-weight: 800; font-size: 15px; }
  .ann .m { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .ann .b { font-size: 14px; white-space: pre-wrap; }
  .note-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }

  /* ---------- profile ---------- */
  .profCard { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .profPhoto { width: 130px; height: 150px; object-fit: cover; border-radius: 14px; border: 1px solid var(--border); background: var(--surface2); }
  .profAvatar { width: 130px; height: 150px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 800;
    box-shadow: var(--shadow); }
  .profInfo { flex: 1; min-width: 260px; }
  .profInfo table.grid { margin-top: 0; }

  /* ---------- print (forced light) ---------- */
  #print-area { display: none; }
  @media print {
    body { background: #fff !important; color: #000 !important; }

<script>
'use strict';
/* ============================== helpers ============================== */
var ME = null, CUR_TAB = '', SETTINGS = {}, CLASSES = [], SUBJECT_CACHE = {};
var DEFAULT_PRIMARY = '#0d9488';

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function gv(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
function gvi(id) { var v = parseInt(gv(id), 10); return isNaN(v) ? null : v; }
function gvn(id) { var v = parseFloat(gv(id)); return isNaN(v) ? null : v; }
function badge(txt, cls) { return '<span class="badge ' + cls + '">' + esc(txt) + '</span>'; }
function rs(n) { return 'Rs ' + Number(n || 0).toLocaleString('en-PK'); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function curMonth() { return todayISO().slice(0, 7); }
function gradeOf(p) {
  p = Number(p || 0);
  if (p >= 90) return 'A+'; if (p >= 80) return 'A'; if (p >= 70) return 'B';
  if (p >= 60) return 'C'; if (p >= 50) return 'D'; if (p >= 40) return 'E'; return 'F';
}
function feeBadge(st) {
  var c = st === 'PAID' ? 'b-paid' : (st === 'PARTIAL' ? 'b-partial' : (st === 'OVERDUE' ? 'b-overdue' : 'b-unpaid'));
  return badge(st, c);
}
function attBadge(st) {
  var c = st === 'PRESENT' ? 'b-present' : (st === 'LEAVE' ? 'b-leave' : 'b-absent');
  return badge(st, c);
}
function api(method, url, body) {
  return fetch(url, {
    method: method,
    headers: { 'Content-Type': 'application/json' },
    body: body !== undefined ? JSON.stringify(body) : undefined
  }).then(function (r) {
    if (r.status === 401) {
      if (ME) { location.reload(); }
      return r.json().catch(function () { return {}; }).then(function (j) {
        return { status: 401, body: j };
      });
    }
    return r.json().then(function (j) { return { status: r.status, body: j }; });
  });
}
function apiError(r, what) {
  alert((what || 'Request failed') + ': ' + (r.body && r.body.error ? r.body.error : 'HTTP ' + r.status));
}

/* ============================== theme / branding ============================== */
function applyPrimary(color) {
  var c = /^#[0-9a-fA-F]{6}$/.test(String(color || '')) ? color : DEFAULT_PRIMARY;
  document.documentElement.style.setProperty('--primary', c);
}
function logoSrc(v) {
  if (!v) return v;
  return v === '/api/logo' ? v + '?t=' + Date.now() : v;
}
function applyBranding(s) {
  var nm = s.school_name || 'SMS';
  document.getElementById('schoolTitle').textContent = nm;
  var lg = document.getElementById('schoolLogo');
  if (s.school_logo) { lg.src = logoSrc(s.school_logo); lg.classList.remove('hidden'); }
  else lg.classList.add('hidden');
  applyPrimary(s.theme_color);
}
function refreshHeader() {
  api('GET', '/api/settings').then(function (r) {
    if (r.status === 200) { SETTINGS = r.body || {}; applyBranding(SETTINGS); }
  });
}
function loadPublicSettings() {
  fetch('/api/public-settings').then(function (r) { return r.json(); }).then(function (s) {
    document.getElementById('loginTitle').textContent = (s.school_name || 'SMS');
    var lg = document.getElementById('loginLogo');
    if (s.school_logo) { lg.src = logoSrc(s.school_logo); lg.classList.remove('hidden'); var mk = document.getElementById('loginMark'); if (mk) mk.classList.add('hidden'); }
    applyPrimary(s.theme_color);
  }).catch(function () {});
}
function initTheme() {
  var t = 'light';
  try { t = localStorage.getItem('sms-theme') || 'light'; } catch (e) {}
  document.body.classList.toggle('dark', t === 'dark');
  var b = document.getElementById('themeBtn');
  if (b) b.textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  var dark = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', dark);
  try { localStorage.setItem('sms-theme', dark ? 'dark' : 'light'); } catch (e) {}
  document.getElementById('themeBtn').textContent = dark ? '☀️' : '🌙';
}

/* ============================== auth ============================== */
function doLogin() {
  var u = gv('lu'), p = document.getElementById('lp').value;
  if (!u || !p) { document.getElementById('loginErr').textContent = 'Enter username and password'; return; }
  api('POST', '/api/login', { username: u, password: p }).then(function (r) {
    if (r.status === 200 && r.body.ok) { ME = r.body.user; enter(); }
    else document.getElementById('loginErr').textContent = (r.body && r.body.error) || 'Login failed';
  }).catch(function () { document.getElementById('loginErr').textContent = 'Server unreachable'; });
}
function doLogout() { api('POST', '/api/logout').then(function () { location.reload(); }).catch(function () { location.reload(); }); }
function openPwModal() {
  showModal('<h3>Change password</h3>' +
    '<input id="pwOld" type="password" placeholder="Current password">' +
    '<input id="pwNew" type="password" placeholder="New password (min 6 chars)">' +
    '<input id="pwNew2" type="password" placeholder="Confirm new password">' +
    '<div class="row"><button class="btn grey" onclick="closeModal()">Cancel</button>' +
    '<button class="btn green" onclick="doChangePw()">Save</button></div>');
}
function doChangePw() {
  var a = document.getElementById('pwOld').value, b = document.getElementById('pwNew').value, c = document.getElementById('pwNew2').value;
  if (!a || !b || !c) { alert('All fields are required'); return; }
  if (b !== c) { alert('New passwords do not match'); return; }
  if (b.length < 6) { alert('New password must be at least 6 characters'); return; }
  api('POST', '/api/me/password', { old: a, new: b }).then(function (r) {
    if (r.status !== 200) apiError(r, 'Password change failed');
    else { closeModal(); alert('Password changed'); }
  });
}
function showModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalWrap').classList.remove('hidden');
}
function closeModal() { document.getElementById('modalWrap').classList.add('hidden'); }

/* User-creation privacy: passwords are NEVER displayed. New logins always use the
   default password; the creator copies a WhatsApp-ready text to send privately. */
var DEFAULT_NEW_PASSWORD = '1234567';
function loginDetailsText(username) {
  return 'Assalam-o-Alaikum! Your school system login:\nUsername: ' + username +
    '\nPassword: ' + DEFAULT_NEW_PASSWORD +
    '\nPlease change your password after first login (header > Change password).';
}
function copyLoginDetails(username) {
  var txt = loginDetailsText(username);
  var done = function () { alert('Login details copied — send privately via WhatsApp.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, function () { prompt('Copy login details:', txt); });
  } else { prompt('Copy login details:', txt); }
}
function showLoginCreatedModal(username) {
  showModal('<h3>Login created — ' + esc(username) + '</h3>' +
    '<p class="hint">Default password <b>' + DEFAULT_NEW_PASSWORD + '</b> is set. ' +
    'The password is not shown here — copy the details and send them privately.</p>' +
    '<div class="row"><button class="btn green" data-u="' + esc(username) + '" onclick="copyLoginDetails(this.getAttribute(\'data-u\'))">Copy login details</button> ' +
    '<button class="btn grey" onclick="closeModal()">Done</button></div>');
}

/* ============================== tab framework ============================== */
var TABS = {
  super_admin: ['dashboard', 'ai_assistant', 'students', 'admissions', 'teachers', 'leaves', 'subjects', 'timetable', 'attendance', 'fees', 'exams', 'notes', 'announcements', 'salaries', 'expenses', 'idcards', 'certificates', 'warnings', 'complaints', 'users', 'audit', 'erdiagram', 'about', 'settings'],
  principal: ['dashboard', 'ai_assistant', 'students', 'admissions', 'teachers', 'leaves', 'subjects', 'timetable', 'attendance', 'fees', 'exams', 'notes', 'announcements', 'salaries', 'expenses', 'idcards', 'certificates', 'warnings', 'reports', 'about', 'settings'],

function aboutSectionForm(id) {

function loadClasses(cb) {
  api('GET', '/api/classes').then(function (r) {
    CLASSES = (r.status === 200 && Array.isArray(r.body)) ? r.body : [];

  }).catch(function () { if (cb) cb(); });

function className(id) {
  for (var i = 0; i < CLASSES.length; i++) if (CLASSES[i].id === id) return CLASSES[i].name + '-' + CLASSES[i].section;
  return '';
}
function classRank(nm) {
  // KG first, then numeric classes ascending, then anything else A-Z
  if (String(nm).trim().toUpperCase() === 'KG') return [0, 0, ''];
  var n = parseInt(nm, 10);
  if (!isNaN(n) && String(n) === String(nm).trim()) return [1, n, ''];
  return [2, 0, String(nm).toUpperCase()];
}
function classOptions(selId, selected, includeAll) {
  var h = includeAll ? '<option value="">All classes</option>' : '';
  var arr = CLASSES.slice(), counts = {}, i, j;
  for (i = 0; i < arr.length; i++) counts[arr[i].name] = (counts[arr[i].name] || 0) + 1;
  arr.sort(function (a, b) {
    var ra = classRank(a.name), rb = classRank(b.name);
    if (ra[0] !== rb[0]) return ra[0] - rb[0];
    if (ra[1] !== rb[1]) return ra[1] - rb[1];
    if (ra[2] < rb[2]) return -1;
    if (ra[2] > rb[2]) return 1;
    return String(a.section) < String(b.section) ? -1 : 1;
  });
  for (j = 0; j < arr.length; j++) {
    var c = arr[j];
    var lbl = counts[c.name] > 1 ? (c.name + '-' + c.section) : c.name;
    h += '<option value="' + c.id + '"' + (String(c.id) === String(selected) ? ' selected' : '') + '>' + esc(lbl) + '</option>';
  }
  return h;
}

}

function saveStudent() {

function saveTeacher() {

/* ============================== timetable ============================== */
var TT = { class_id: '' }, TT_ROWS = [];
var TT_DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function isTtEditor() { return ME.role === 'super_admin' || ME.role === 'principal' || ME.role === 'clerk'; }
function loadTimetable() {
  var m = document.getElementById('main');
  if (isTtEditor()) {
    m.innerHTML = '<h2 class="sec">Class Timetable</h2>' +
      '<div class="toolbar"><select id="ttCls" onchange="TT.class_id=gv(\'ttCls\');loadTtGrid()">' +
      '<option value="">Select class</option>' + classOptions(null, TT.class_id, false) + '</select> ' +
      '<button class="btn grey" onclick="printTtGrid()">Print</button> ' +
      '<button class="btn" onclick="addTtPeriod()">+ Add period</button></div>' +
      '<div id="ttGrid"><p class="hint">Pick a class to view its weekly timetable (Monday–Saturday).</p></div>';
    if (TT.class_id) loadTtGrid();
    return;
  }
  if (ME.role === 'student') {
    api('GET', '/api/timetable').then(function (r) {
      var rows = (r.status === 200 ? r.body : []) || [];
      var label = rows.length ? (rows[0].class_label || className(rows[0].class_id)) : 'My class';
      renderTtGrids(m, [{ label: label, rows: rows }]);
    });
    return;
  }
  api('GET', '/api/me/teacher').then(function (r) {
    if (r.status !== 200) { apiError(r, 'Could not load'); return; }
    var asg = r.body.assigned || r.body.assignments || [];
    var clsMap = {};
    for (var i = 0; i < asg.length; i++) {
      if (asg[i].class_id) clsMap[asg[i].class_id] = asg[i].class_name || className(asg[i].class_id);
    }
    var ids = Object.keys(clsMap);
    if (!ids.length) { m.innerHTML = '<h2 class="sec">Timetable</h2><p class="hint">No assigned classes.</p>'; return; }
    var chain = Promise.resolve(), groups = [];
    ids.forEach(function (cid) {
      chain = chain.then(function () {
        return api('GET', '/api/timetable?class_id=' + cid).then(function (r2) {
          groups.push({ label: clsMap[cid], rows: (r2.status === 200 ? r2.body : []) || [] });
        });
      });
    });
    chain.then(function () { renderTtGrids(m, groups); });
  });
}
function renderTtGrids(m, groups) {
  var h = '<h2 class="sec">Timetable</h2>';
  for (var g = 0; g < groups.length; g++) {
    h += '<h3 class="sub">Class ' + esc(groups[g].label || '') + '</h3>' + ttGridHtml(groups[g].rows, false);
  }
  m.innerHTML = h + (groups.length ? '' : '<p class="hint">No timetable data.</p>');
}
function loadTtGrid() {
  var el = document.getElementById('ttGrid');
  if (!TT.class_id) { el.innerHTML = '<p class="hint">Pick a class.</p>'; return; }
  api('GET', '/api/timetable?class_id=' + TT.class_id).then(function (r) {
    TT_ROWS = (r.status === 200 ? r.body : []) || [];
    TT.extraP = 0;
    el.innerHTML = ttGridHtml(TT_ROWS, true);
  });
}
function addTtPeriod() {
  // super_admin / principal / clerk: grow the grid beyond 6 periods, as many as needed
  TT.extraP = (TT.extraP || 0) + 1;
  document.getElementById('ttGrid').innerHTML = ttGridHtml(TT_ROWS, true);
}
function ttGridHtml(rows, editable) {
  var map = {}, maxP = Math.max(6, 6 + (TT.extraP || 0)), i, d, p;
  for (i = 0; i < rows.length; i++) {
    var e = rows[i];
    map[e.day_of_week + '|' + e.period_no] = e;
    if (e.period_no > maxP) maxP = e.period_no;
  }
  var h = '<div class="ttwrap"><table class="grid"><tr><th style="width:64px">Period</th>';
  for (d = 0; d < TT_DAYS.length; d++) h += '<th>' + TT_DAYS[d] + '</th>';
  h += '</tr>';
  for (p = 1; p <= maxP; p++) {
    h += '<tr><td><b>P' + p + '</b></td>';
    for (d = 0; d < TT_DAYS.length; d++) {
      var cell = map[TT_DAYS[d] + '|' + p];
      if (cell) {
        h += '<td><div class="tt-cell"><div class="tt-sub">' + esc(cell.subject_name || '—') + '</div>' +
          (cell.teacher_name ? '<div class="tt-t">' + esc(cell.teacher_name) + '</div>' : '') +
          (cell.room ? '<div class="tt-r">Room: ' + esc(cell.room) + '</div>' : '') +
          ((cell.start_time || cell.end_time) ? '<div class="tt-r">' + esc(cell.start_time || '') + '–' + esc(cell.end_time || '') + '</div>' : '');
        if (editable) {
          h += '<div class="tt-a"><button class="btn small" onclick="openTtModal(' + cell.id + ')">Edit</button> ' +
            '<button class="btn small danger" onclick="delTt(' + cell.id + ')">Delete</button></div>';
        }
        h += '</div></td>';
      } else if (editable) {
        h += '<td><button class="btn small grey" onclick="openTtModal(0,\'' + TT_DAYS[d] + '\',' + p + ')">+ Add</button></td>';
      } else {
        h += '<td><span class="hint">—</span></td>';
      }
    }
    h += '</tr>';
  }
  return h + '</table></div>';
}
/* print-only timetable table: proper thead/tbody so print renders the header row correctly */
function ttHM(t) {
  if (!t) return '';
  var m = String(t).match(/(\d{1,2}):(\d{2})/);
  return m ? (m[1].length < 2 ? '0' + m[1] : m[1]) + ':' + m[2] : String(t);
}
function ttEndGuess(start) {
  var m = String(start || '').match(/(\d{1,2}):(\d{2})/);
  if (!m) return '';
  var mins = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + 45; /* default 45-min period */
  var h = Math.floor(mins / 60) % 24, mm = mins % 60;
  return (h < 10 ? '0' + h : '' + h) + ':' + (mm < 10 ? '0' + mm : '' + mm);
}
function ttPrintHtml(rows) {
  var map = {}, maxP = 6, i, d, p;
  for (i = 0; i < rows.length; i++) {
    var e = rows[i];
    map[e.day_of_week + '|' + e.period_no] = e;
    if (e.period_no > maxP) maxP = e.period_no;
  }
  var h = '<div class="ttwrap"><table class="grid"><thead><tr><th style="width:70px"></th>';
  for (d = 0; d < TT_DAYS.length; d++) h += '<th>' + TT_DAYS[d].toUpperCase() + '</th>';
  h += '</tr></thead><tbody>';
  for (p = 1; p <= maxP; p++) {
    h += '<tr><td><b>P' + p + '</b></td>';
    for (d = 0; d < TT_DAYS.length; d++) {
      var cell = map[TT_DAYS[d] + '|' + p];
      if (cell) {
        var st = ttHM(cell.start_time), en = ttHM(cell.end_time) || (st ? ttEndGuess(cell.start_time) : '');
        h += '<td><div class="tt-cell">' +
          '<div class="tt-sub">' + esc(cell.subject_name || '—') + '</div>' +
          (cell.teacher_name ? '<div class="tt-t">' + esc(cell.teacher_name) + '</div>' : '') +
          (cell.room ? '<div class="tt-r">Room: ' + esc(cell.room) + '</div>' : '') +
          (st ? '<div class="tt-r">' + st + '–' + en + '</div>' : '') +
          '</div></td>';
      } else {
        h += '<td><span class="hint">—</span></td>';
      }
    }
    h += '</tr>';
  }
  return h + '</tbody></table></div>';
}
var TT_EDIT = null;
function openTtModal(entryId, day, period) {
  var e = null, i;
  for (i = 0; i < TT_ROWS.length; i++) if (TT_ROWS[i].id === entryId) e = TT_ROWS[i];
  TT_EDIT = e;
  var dd = e ? e.day_of_week : day, pp = e ? e.period_no : period;
  showModal('<h3>' + (e ? 'Edit period' : 'Add period') + ' — ' + esc(dd) + ', Period ' + pp + '</h3>' +
    '<div class="row" style="display:flex;flex-direction:column;gap:10px">' +
    '<select id="ttSubj"><option value="">Select subject</option></select>' +
    '<select id="ttTea"><option value="">Select teacher</option></select>' +
    '<input id="ttRoom" placeholder="Room" value="' + esc(e ? (e.room || '') : '') + '">' +
    '<div style="display:flex;gap:10px"><input id="ttStart" type="time" value="' + esc((e && e.start_time) || '') + '" title="Start time"> ' +
    '<input id="ttEnd" type="time" value="' + esc((e && e.end_time) || '') + '" title="End time"></div></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn grey" onclick="closeModal()">Cancel</button> ' +
    '<button class="btn green" onclick="saveTt(\'' + dd + '\',' + pp + ')">Save</button></div>');
  api('GET', '/api/subjects?class_id=' + TT.class_id).then(function (r) {
    var rows = (r.status === 200 ? r.body : []) || [], sel = document.getElementById('ttSubj');
    if (!sel) return;
    var h = '<option value="">Select subject</option>';
    for (var j = 0; j < rows.length; j++) {
      h += '<option value="' + rows[j].id + '"' + (e && String(e.subject_id) === String(rows[j].id) ? ' selected' : '') + '>' + esc(rows[j].name) + '</option>';
    }
    sel.innerHTML = h;
  });
  api('GET', '/api/teachers').then(function (r) {
    var rows = (r.status === 200 ? r.body : []) || [], sel = document.getElementById('ttTea');
    if (!sel) return;
    var h = '<option value="">Select teacher</option>';
    for (var k = 0; k < rows.length; k++) {
      h += '<option value="' + rows[k].id + '"' + (e && String(e.teacher_id) === String(rows[k].id) ? ' selected' : '') + '>' + esc(rows[k].name) + '</option>';
    }
    sel.innerHTML = h;
  });
}
function saveTt(day, period) {
  var d = {
    class_id: parseInt(TT.class_id, 10), day_of_week: day, period_no: period,
    start_time: gv('ttStart') || null, end_time: gv('ttEnd') || null,
    subject_id: gvi('ttSubj'), teacher_id: gvi('ttTea'), room: gv('ttRoom') || null
  };
  api('POST', '/api/timetable', d).then(function (r) {
    closeModal();
    if (r.status !== 200) apiError(r, 'Save failed'); else loadTtGrid();
  });
}
function delTt(id) {
  if (!confirm('Delete this timetable period?')) return;
  api('DELETE', '/api/timetable/' + id).then(function (r) {
    if (r.status !== 200) apiError(r, 'Delete failed'); else loadTtGrid();
  });
}
function printTtGrid() {
  if (!TT.class_id || !TT_ROWS.length) { alert('Load a class timetable first'); return; }
  var h = prHead('CLASS TIMETABLE', 'Class: ' + esc(className(parseInt(TT.class_id, 10)))) +
    ttPrintHtml(TT_ROWS) + '</div>';
  doPrint(h);

/* ============================== attendance ============================== */
var ATT = { class_id: '', date: '' }, ATT_ROWS = [], TEA_ASG = null;
function isTeacher() { return ME.role === 'teacher'; }
function loadAttendance() {
  if (isTeacher()) {
    api('GET', '/api/me/teacher').then(function (r) {
      if (r.status !== 200) { apiError(r, 'Could not load assignments'); return; }
      var d = r.body, asg = d.assigned || d.assignments || [];
      var clsMap = {};

      TEA_ASG = [];
      for (var k in clsMap) TEA_ASG.push({ id: k, label: clsMap[k] });

function renderAttForm(teacherMode) {

    '<input id="attDate" type="date" value="' + ATT.date + '" onchange="ATT.date=gv(\'attDate\');loadAttRows()"> ' +

    '<button class="btn warn" onclick="attMarkAll(\'ABSENT\')">All absent</button> ' +
    '<button class="btn grey" onclick="attMarkAll(\'LEAVE\')">All leave</button> ' +
    '<button class="btn green" onclick="saveAttendance()">Save attendance</button>' +

var NOTE = { class_id: '', subject_id: '', q: '' }, NOTE_ROWS = [], TEA_SUBJ = null;

    '<input id="ntTitle" placeholder="Title *"> ' +
    '<input id="ntFile" type="file" accept=".pdf"> ' +
    '<button class="btn green" onclick="uploadNote()">Upload</button></div></div>' : '') +
    '<div class="toolbar"><select id="ntFCls" onchange="NOTE.class_id=gv(\'ntFCls\');NOTE.subject_id=\'\';noteFilterSubj();loadNoteTable()"><option value="">All classes</option></select> ' +

        var cls = (r2.status === 200 && r2.body.student) ? r2.body.student.class_id : null;

          noteFilterSubj();
          loadNoteTable();
        }

function populateNoteClasses() {
  var mk = function (classes) {
    var f = document.getElementById('ntFCls'), u = document.getElementById('ntCls');
    var h = '<option value="">All classes</option>', h2 = '<option value="">Select class *</option>';
    for (var i = 0; i < classes.length; i++) {
      h += '<option value="' + classes[i].id + '">' + esc(classes[i].label) + '</option>';
      h2 += '<option value="' + classes[i].id + '">' + esc(classes[i].label) + '</option>';
    }
    if (f) f.innerHTML = h;
    if (u) u.innerHTML = h2;
  };
  if (isTeacher()) {
    api('GET', '/api/me/teacher').then(function (r) {
      var asg = (r.status === 200 ? (r.body.assigned || r.body.assignments || []) : []);
      TEA_SUBJ = asg;
      var clsMap = {};
      for (var i = 0; i < asg.length; i++) if (asg[i].class_id) clsMap[asg[i].class_id] = asg[i].class_name || className(asg[i].class_id);
      var arr = [];
      for (var k in clsMap) arr.push({ id: k, label: clsMap[k] });
      mk(arr);
    });
  } else {
    mk(CLASSES.map(function (c) { return { id: c.id, label: c.name + '-' + c.section }; }));
  }
}
function noteSubjRefresh() {
  var cid = gv('ntCls');
  var sel = document.getElementById('ntSub');
  if (isTeacher() && TEA_SUBJ) {
    var h = '<option value="">Select subject *</option>';
    for (var i = 0; i < TEA_SUBJ.length; i++) {
      if (String(TEA_SUBJ[i].class_id) === String(cid)) {
        h += '<option value="' + TEA_SUBJ[i].subject_id + '">' + esc(TEA_SUBJ[i].subject_name || '') + '</option>';
      }
    }
    sel.innerHTML = h;
  } else {
    loadSubjectsForClass(cid, 'ntSub');
  }
}
function noteFilterSubj() {
  var sel = document.getElementById('ntFSub');
  if (!NOTE.class_id || !sel) { if (sel) sel.innerHTML = '<option value="">All subjects</option>'; return; }
  api('GET', '/api/subjects?class_id=' + NOTE.class_id).then(function (r) {
    var rows = (r.status === 200 ? r.body : []) || [];
    var h = '<option value="">All subjects</option>';
    for (var i = 0; i < rows.length; i++) h += '<option value="' + rows[i].id + '">' + esc(rows[i].name) + '</option>';
    sel.innerHTML = h;
  });
}
function noteQuery() {
  var p = [];
  if (NOTE.class_id) p.push('class_id=' + NOTE.class_id);
  if (NOTE.subject_id) p.push('subject_id=' + NOTE.subject_id);
  return '/api/notes' + (p.length ? '?' + p.join('&') : '');
}
function loadNoteTable() {
  api('GET', noteQuery()).then(function (r) {
    var el = document.getElementById('noteTbl');
    if (!el) return;
    if (r.status !== 200) { el.innerHTML = '<p>Could not load notes.</p>'; return; }
    NOTE_ROWS = r.body || [];
    var q = NOTE.q.toLowerCase();
    var h = '<table class="grid"><tr><th>Title</th><th>Class</th><th>Subject</th><th>Uploaded</th><th>Actions</th></tr>';
    var n = 0;
    for (var i = 0; i < NOTE_ROWS.length; i++) {
      var nt = NOTE_ROWS[i];
      if (q && (nt.title || '').toLowerCase().indexOf(q) < 0) continue;
      n++;
      h += '<tr><td>' + esc(nt.title) + '</td><td>' + esc(nt.class_name || className(nt.class_id)) +
        '</td><td>' + esc(nt.subject_name || '') + '</td><td>' + esc((nt.uploaded_at || '').slice(0, 10)) +
        '</td><td><a class="btn small" href="/api/notes/' + nt.id + '/file" target="_blank" style="text-decoration:none">Download</a> ';
      if (ME.role === 'super_admin' || ME.role === 'principal') {
        h += '<button class="btn small danger" onclick="delNote(' + nt.id + ')">Delete</button>';
      }
      h += '</td></tr>';
    }
    el.innerHTML = h + '</table><p class="hint">' + n + ' note(s)</p>';
  });
}
function uploadNote() {
  var cid = gv('ntCls'), sid = gv('ntSub'), title = gv('ntTitle');
  var inp = document.getElementById('ntFile');
  if (!cid || !sid || !title) { alert('Class, subject and title are required'); return; }
  if (!inp || !inp.files.length) { alert('Choose a PDF file'); return; }
  var fd = new FormData();
  fd.append('class_id', cid); fd.append('subject_id', sid);
  fd.append('title', title); fd.append('file', inp.files[0]);
  fetch('/api/notes', { method: 'POST', body: fd }).then(function (r) {
    return r.json().then(function (b) { return { status: r.status, body: b }; });
  }).then(function (r) {
    if (r.status !== 200) apiError(r, 'Upload failed'); else { alert('Note uploaded'); loadNotes(); }
  });
}
function delNote(id) {
  if (!confirm('Delete this note?')) return;
  api('DELETE', '/api/notes/' + id).then(function (r) {
    if (r.status !== 200) apiError(r, 'Delete failed'); else loadNoteTable();
  });
}

function saveSettings() {
  if (ME.role !== 'super_admin') { alert('Only super admin can change settings'); return; }
  var chain = Promise.resolve(), saved = 0, total = SET_KEYS.length + SET_TEXTAREAS.length;
  SET_KEYS.forEach(function (k) {
    chain = chain.then(function () {
      var v = gv('set_' + k[0]);
      return api('POST', '/api/settings', { key: k[0], value: v }).then(function (r) {
        if (r.status === 200) { saved++; SETTINGS[k[0]] = v; }
      });
    });
  });
  SET_TEXTAREAS.forEach(function (ta) {
    chain = chain.then(function () {
      var v = gv('set_' + ta[0]);
      return api('POST', '/api/settings', { key: ta[0], value: v }).then(function (r) {
        if (r.status === 200) { saved++; SETTINGS[ta[0]] = v; }
      });
    });
  });
  chain.then(function () {
    applyBranding(SETTINGS);
    alert('Settings saved (' + saved + '/' + total + ')');
  });
}
function uploadLogo() {
  if (ME.role !== 'super_admin') { alert('Only super admin can change the logo'); return; }

  fd.append('logo', inp.files[0]);
  fetch('/api/settings/logo', { method: 'POST', body: fd }).then(function (r) {
    return r.json().then(function (b) { return { status: r.status, body: b }; });
  }).then(function (r) {
    if (r.status === 200) {
      SETTINGS.school_logo = '/api/logo';
      var si = document.getElementById('set_school_logo');
      if (si) si.value = '/api/logo';

}
function downloadBackup() {
  if (ME.role !== 'super_admin') { alert('Only super admin can download backups'); return; }

  }).catch(function (e) { alert(e.message); });

        var ih = '<table class="grid"><tr><th>Month</th><th>Total</th><th>Paid</th><th>Status</th><th>Receipt</th><th></th></tr>';

      for (var j = 0; j < res.length; j++) {

    });

/* ============================== Gemini AI Assistant ============================== */
var AI_MESSAGES = [];
var AI_LOADING = false;
var AI_STATUS = null;

function formatAIMarkdown(raw) {
  if (!raw) return '';
  var s = esc(raw);

  // Fenced code blocks ```lang\ncode\n```
  s = s.replace(/```([a-zA-Z0-9_\-\.]*)\n([\s\S]*?)```/g, function (_, lang, code) {
    return '<div class="ai-code-block"><div class="ai-code-header">' + (lang || 'code') + '</div><pre><code>' + code.trim() + '</code></pre></div>';
  });

  // Inline code `code`
  s = s.replace(/`([^`\n]+)`/g, '<code class="ai-inline-code">$1</code>');

  // Bold **text**
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

  // Italic *text*
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');

  // Headers: ###, ##, #
  s = s.replace(/^### (.*$)/gim, '<h4 class="ai-h4">$1</h4>');
  s = s.replace(/^## (.*$)/gim, '<h3 class="ai-h3">$1</h3>');
  s = s.replace(/^# (.*$)/gim, '<h3 class="ai-h3">$1</h3>');

  // Blockquotes > text
  s = s.replace(/^\> (.*$)/gim, '<blockquote class="ai-blockquote">$1</blockquote>');

  // Lists: unordered
  s = s.replace(/^\s*[\-\*]\s+(.*)$/gim, '<li class="ai-li">$1</li>');
  s = s.replace(/(<li class="ai-li">.*<\/li>\s*)+/g, '<ul class="ai-ul">$&</ul>');

  // Lists: ordered
  s = s.replace(/^\s*(\d+)\.\s+(.*)$/gim, '<li class="ai-oli" data-n="$1">$2</li>');
  s = s.replace(/(<li class="ai-oli".*<\/li>\s*)+/g, '<ol class="ai-ol">$&</ol>');

  // Paragraphs and linebreaks
  s = s.replace(/\n{2,}/g, '</p><p class="ai-p">');
  s = s.replace(/\n/g, '<br>');

  return '<p class="ai-p">' + s + '</p>';
}

function getQuickPromptsByRole() {
  var r = (ME && ME.role) || 'teacher';
  if (r === 'super_admin') {
    return [
      { label: '📊 School Overview', prompt: 'Give me an executive summary of our school operations, active student counts, staff overview, and current month fee collection status.' },
      { label: '📢 Annual Sports Day Circular', prompt: 'Draft an exciting and formal school circular to parents announcing the Annual Sports Day with schedule, dress code, and participation details.' },
      { label: '💰 Fee Recovery Plan', prompt: 'Suggest 4 polite, professional, and effective steps for following up on overdue student fee payments.' },
      { label: '📋 Teacher Appraisal Rubric', prompt: 'Create an evaluation rubric and checklist for assessing secondary school teachers on classroom engagement and lesson delivery.' }
    ];
  } else if (r === 'principal') {
    return [
      { label: '👥 Attendance Improvement', prompt: 'Suggest 4 actionable initiatives to improve student attendance and reduce unexcused absences.' },
      { label: '📢 Winter Vacation Notice', prompt: 'Draft a notice to parents and students regarding winter vacation dates, reopening schedule, and holiday homework instructions.' },
      { label: '🎯 PTM Agenda', prompt: 'Draft a structured agenda and talking points for an upcoming Parent-Teacher Meeting (PTM).' },
      { label: '📝 Exam Conduct Guidelines', prompt: 'Provide guidelines for teachers and invigilators for conducting fair and disciplined term examinations.' }
    ];
  } else if (r === 'teacher') {
    return [
      { label: '📝 45-Min Lesson Plan', prompt: 'Create a structured 45-minute lesson plan for Class 8 Mathematics on "Introduction to Linear Equations" with learning objectives, practice problems, and recap.' },
      { label: '❓ 5 Quiz Questions', prompt: 'Generate 5 multiple-choice questions (with answer key) and 2 short conceptual questions suitable for middle school science.' },
      { label: '💡 Classroom Activities', prompt: 'Suggest 3 quick, interactive classroom activities to engage students and reinforce today’s topic.' },
      { label: '✍️ Report Card Remarks', prompt: 'Provide 5 encouraging, constructive remarks for students who are capable but need better consistency in homework.' }
    ];
  } else if (r === 'clerk') {
    return [
      { label: '📩 WhatsApp Fee Reminder', prompt: 'Draft a polite WhatsApp fee reminder message in both English and Urdu for parents of students with overdue fee invoices.' },
      { label: '📑 Admission Document Checklist', prompt: 'List the required verification documents and step-by-step intake procedure for enrolling a new student.' },
      { label: '💵 Fee Concession Criteria', prompt: 'Explain the standard criteria and documentation needed when evaluating sibling or hardship fee concession requests.' }
    ];
  } else {
    return [
      { label: '📚 Explain a Concept', prompt: 'Explain the concept of Photosynthesis in simple terms with everyday examples and key summary bullet points.' },
      { label: '🗓️ 2-Week Study Schedule', prompt: 'Create a balanced 2-week daily exam revision timetable for 8th grade subjects (Maths, Science, English, Urdu).' },
      { label: '❓ Practice Quiz', prompt: 'Give me 5 practice conceptual questions on Science with step-by-step hints.' },
      { label: '🧠 Exam Memorization Tips', prompt: 'What are 4 scientifically proven study and memory techniques (like active recall and spaced repetition) for exams?' }
    ];
  }
}

function fetchAIStatus(cb) {
  api('GET', '/api/ai/status').then(function (r) {
    if (r.status === 200) AI_STATUS = r.body;
    if (cb) cb(AI_STATUS);
  }).catch(function () { if (cb) cb(null); });
}

function fetchAIChatHistory(cb) {
  api('GET', '/api/ai/history').then(function (r) {
    if (r.status === 200 && Array.isArray(r.body)) {
      AI_MESSAGES = r.body;
    }
    if (cb) cb();
  }).catch(function () { if (cb) cb(); });
}

function renderChatMessagesHTML(messages, loading) {
  if (!messages || messages.length === 0) {
    var greeting = 'Assalam-o-Alaikum ' + esc((ME && (ME.display_name || ME.username)) || 'there') + '! 👋';
    var configured = AI_STATUS && AI_STATUS.configured;
    var hintKey = !configured
      ? '<div style="margin-top:10px;padding:10px 14px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.3);border-radius:10px;font-size:12.5px;">' +
        '🔑 <b>Gemini API key is not configured.</b><br>' +
        (ME && ME.role === 'super_admin' ? 'Configure it in <a href="javascript:showTab(\'settings\')" style="color:var(--primary);font-weight:700">Settings</a>.' : 'Please ask the Super Admin to configure the Gemini API key in Settings.') +
        '</div>'
      : '';
    return '<div class="ai-bubble assistant">' +
      '<div class="ai-avatar">✨</div>' +
      '<div class="ai-content"><p class="ai-p"><b>' + greeting + '</b></p>' +
      '<p class="ai-p">I am your school Gemini AI Assistant. I can help with lesson plans, exam questions, attendance analysis, fee notices, circulars, and study revision.</p>' +
      '<p class="ai-p">Pick a quick suggestion below or ask me anything!</p>' +
      hintKey +
      '</div></div>';
  }

  var html = '';
  for (var i = 0; i < messages.length; i++) {
    var m = messages[i];
    var isUser = m.role === 'user';
    var avatar = isUser ? ((ME && ME.username && ME.username.charAt(0).toUpperCase()) || 'U') : '✨';
    var copyBtn = !isUser
      ? '<button class="ai-copy-btn" onclick="copyAIText(this, ' + i + ')">📋 Copy</button>'
      : '';
    var body = isUser ? '<p class="ai-p">' + esc(m.content).replace(/\n/g, '<br>') + '</p>' : formatAIMarkdown(m.content);

    html += '<div class="ai-bubble ' + (isUser ? 'user' : 'assistant') + '">' +
      '<div class="ai-avatar">' + avatar + '</div>' +
      '<div class="ai-content">' + body + copyBtn + '</div></div>';
  }

  if (loading) {
    html += '<div class="ai-bubble assistant">' +
      '<div class="ai-avatar">✨</div>' +
      '<div class="ai-content"><span class="ai-typing">' +
      '<span class="ai-typing-dot"></span><span class="ai-typing-dot"></span><span class="ai-typing-dot"></span>' +
      '</span></div></div>';
  }

  return html;
}

function renderChipsHTML(source) {
  var prompts = getQuickPromptsByRole();
  var html = '';
  for (var i = 0; i < prompts.length; i++) {
    var p = prompts[i];
    html += '<button class="ai-chip" onclick="aiQuickPrompt(' + i + ', \'' + source + '\')">' + esc(p.label) + '</button>';
  }
  return html;
}

function updateAIChatViews() {
  var dBox = document.getElementById('aiDrawerChatBox');
  if (dBox) {
    dBox.innerHTML = renderChatMessagesHTML(AI_MESSAGES, AI_LOADING);
    dBox.scrollTop = dBox.scrollHeight;
  }
  var dChips = document.getElementById('aiDrawerChips');
  if (dChips) dChips.innerHTML = renderChipsHTML('drawer');

  var pBox = document.getElementById('aiPageChatBox');
  if (pBox) {
    pBox.innerHTML = renderChatMessagesHTML(AI_MESSAGES, AI_LOADING);
    pBox.scrollTop = pBox.scrollHeight;
  }
  var pChips = document.getElementById('aiPageChips');
  if (pChips) pChips.innerHTML = renderChipsHTML('page');
}

function toggleAIDrawer(force) {
  var d = document.getElementById('aiDrawer');
  if (!d) return;
  var open = (typeof force === 'boolean') ? force : d.classList.contains('hidden');
  if (open) {
    d.classList.remove('hidden');
    fetchAIStatus(function () {
      fetchAIChatHistory(function () {
        updateAIChatViews();
        var inp = document.getElementById('aiDrawerInput');
        if (inp) inp.focus();
      });
    });
  } else {
    d.classList.add('hidden');
  }
}

function handleAIInputKey(e, source) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendAIMessage(source);
  }
}

function aiQuickPrompt(idx, source) {
  var prompts = getQuickPromptsByRole();
  if (!prompts[idx]) return;
  var txt = prompts[idx].prompt;
  var inp = document.getElementById(source === 'page' ? 'aiPageInput' : 'aiDrawerInput');
  if (inp) {
    inp.value = txt;
    sendAIMessage(source);
  }
}

function sendAIMessage(source) {
  if (AI_LOADING) return;
  var inp = document.getElementById(source === 'page' ? 'aiPageInput' : 'aiDrawerInput');
  if (!inp) return;
  var text = inp.value.trim();
  if (!text) return;

  inp.value = '';
  inp.style.height = 'auto';

  AI_MESSAGES.push({ role: 'user', content: text });
  AI_LOADING = true;
  updateAIChatViews();

  var sendBtn = document.getElementById(source === 'page' ? 'aiPageSend' : 'aiDrawerSend');
  if (sendBtn) sendBtn.disabled = true;

  api('POST', '/api/ai/chat', { message: text }).then(function (r) {
    AI_LOADING = false;
    if (sendBtn) sendBtn.disabled = false;
    if (r.status === 200 && r.body && r.body.reply) {
      AI_MESSAGES.push({ role: 'assistant', content: r.body.reply });
    } else {
      var err = (r.body && r.body.error) || 'Failed to get response from Gemini.';
      AI_MESSAGES.push({ role: 'assistant', content: '⚠️ **Error:** ' + err });
    }
    updateAIChatViews();
  }).catch(function (err) {
    AI_LOADING = false;
    if (sendBtn) sendBtn.disabled = false;
    AI_MESSAGES.push({ role: 'assistant', content: '⚠️ **Network error:** Could not reach the server.' });
    updateAIChatViews();
  });
}

function clearAIChat() {
  if (!confirm('Clear your AI conversation history?')) return;
  api('POST', '/api/ai/clear').then(function () {
    AI_MESSAGES = [];
    updateAIChatViews();
  });
}

function copyAIText(btn, msgIndex) {
  if (!AI_MESSAGES[msgIndex]) return;
  var text = AI_MESSAGES[msgIndex].content;
  var done = function () {
    btn.innerHTML = '✓ Copied';
    setTimeout(function () { btn.innerHTML = '📋 Copy'; }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { prompt('Copy response:', text); });
  } else {
    prompt('Copy response:', text);
  }
}

function togglePwVisibility(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.type = (el.type === 'password') ? 'text' : 'password';
}

function testAIConnection() {
  var resEl = document.getElementById('aiTestResult');
  if (resEl) {
    resEl.innerHTML = '<span style="color:var(--muted)">⏳ Testing connection to Gemini...</span>';
  }
  api('POST', '/api/ai/test', {}).then(function (r) {
    if (r.status === 200 && r.body && r.body.ok) {
      if (resEl) resEl.innerHTML = '<span style="color:#059669">✅ Connected successfully! (Gemini connection active)</span>';
    } else {
      var em = (r.body && r.body.error) || 'Connection failed';
      if (resEl) resEl.innerHTML = '<span style="color:#dc2626">❌ ' + esc(em) + '</span>';
    }
  }).catch(function (e) {
    if (resEl) resEl.innerHTML = '<span style="color:#dc2626">❌ Network error</span>';
  });
}
